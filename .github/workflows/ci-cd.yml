name: CI / CD – Build & Deploy

on:
  push:
    branches: [ main ]

env:
  # -------------------------------------------------------------------------
  # These two values are *not* secrets – they are just identifiers you will
  # create in GCP (see the gcloud commands below).  Keep them as plain
  # environment variables so the workflow can reference them.
  # -------------------------------------------------------------------------
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}          # just the project ID
  REGION: us-central1
  IMAGE_REPO: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/agent-repo
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # needed for OIDC token exchange

    steps:
      # -------------------------------------------------
      # 1️⃣ Checkout source
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # 2️⃣ Authenticate to Google Cloud via WIF
      # -------------------------------------------------
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          # Fully‑qualified name of the workload‑identity provider you will create
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_PATH }}
          # The service account that GitHub will impersonate
          service_account: github-actions-ci@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      # -------------------------------------------------
      # 3️⃣ Set up Cloud SDK (needed for gcloud builds)
      # -------------------------------------------------
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # -------------------------------------------------
      # 4️⃣ Build & push the **agent‑worker** image
      # -------------------------------------------------
      - name: Build & push agent-worker
        run: |
          IMAGE_WORKER="${{ env.IMAGE_REPO }}/agent-worker:${{ env.IMAGE_TAG }}"
          gcloud builds submit agent-worker --tag "$IMAGE_WORKER"
          echo "WORKER_IMG=$IMAGE_WORKER" >> $GITHUB_ENV

      # -------------------------------------------------
      # 5️⃣ Build & push the **agent‑ingest** image (with SHA tag)
      # -------------------------------------------------
      - name: Build & push agent-ingest
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)          # e.g. a1b2c3d
          IMAGE_INGEST="${{ env.IMAGE_REPO }}/agent-ingest:${SHORT_SHA}"
          gcloud builds submit agent-ingest --tag "$IMAGE_INGEST"
          echo "IMAGE_INGEST=$IMAGE_INGEST" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      # -------------------------------------------------
      # 6️⃣ Deploy the new images to GKE
      # -------------------------------------------------
      - name: Deploy new images to GKE
        run: |
          # Install kubectl (includes the binary) and the GKE auth plugin
          gcloud components install kubectl

          # Authenticate to the target cluster
          gcloud container clusters get-credentials autofix-cluster \
            --region $REGION --project $PROJECT_ID

          # -----------------------------------------------------------------
          # 6a️⃣ Replace the placeholder with the real SHA‑tagged image
          # -----------------------------------------------------------------
          # agent‑ingest manifest
          sed -i "s|image: your-registry/agent-ingest:latest|image: ${IMAGE_INGEST}|g" \
                agent-ingest/deployment.yaml

          # agent‑worker manifest
          sed -i "s|image: your-registry/agent-worker:latest|image: ${WORKER_IMG}|g" \
                agent-worker/deployment.yaml

          # -----------------------------------------------------------------
          # 6b️⃣ Ensure the target namespace exists
          # -----------------------------------------------------------------
          kubectl apply -f k8s/namespace.yaml

          # -----------------------------------------------------------------
          # 6c️⃣ Apply the (now‑correct) Deployment manifests
          # -----------------------------------------------------------------
          kubectl apply -f agent-worker/deployment.yaml -n autofix
          kubectl apply -f agent-ingest/deployment.yaml -n autofix

          # -----------------------------------------------------------------
          # 6d️⃣ (Optional) Re‑set the image on the running Deployments
          # -----------------------------------------------------------------
          kubectl set image deployment/agent-worker \
            agent-worker=${{ env.WORKER_IMG }} -n autofix
          kubectl set image deployment/agent-ingest \
            agent-ingest=${{ env.IMAGE_INGEST }} -n autofix